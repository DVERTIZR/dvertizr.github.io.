<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Redirigiendo... | VRPlus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white flex items-center justify-center min-h-screen font-sans">

  <div class="text-center p-6 space-y-4 max-w-sm">
    <div id="loader" class="w-12 h-12 border-4 border-sky-400 border-t-transparent rounded-full animate-spin mx-auto"></div>
    <h2 class="text-lg font-bold" id="title">Conectando con VRPlus...</h2>
    <p class="text-xs text-slate-400" id="msg">Buscando destino de la placa...</p>
  </div>

  <script>
    const SUPABASE_URL = "https://tnfujiajzzicbzdoutvd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_ePfSCkCTypFz7dSvRc3New_asdhyac0";

    let supabaseClient = null;
    try {
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch (e) {
      console.warn("Supabase no inicializado:", e);
    }

    function obtenerPlacasLocales() {
      try {
        return JSON.parse(localStorage.getItem('vrplus_placas')) || [];
      } catch(e) {
        return [];
      }
    }

    async function ejecutarRedireccion() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const msgEl = document.getElementById('msg');
      const loaderEl = document.getElementById('loader');
      const titleEl = document.getElementById('title');

      if (!id || id.trim() === '') {
        loaderEl.style.display = 'none';
        titleEl.innerText = "ID no detectado";
        msgEl.innerHTML = "No se proporcionó ningún identificador en la URL (falta ?id=...).";
        return;
      }

      let urlDestino = null;

      // 1. Intentar consultar en Supabase con timeout de 2.5 segundos
      if (supabaseClient) {
        try {
          const timeoutPromise = new Promise((_, reject) => 
            setTimeout(() => reject(new Error("Timeout")), 2500)
          );

          const queryPromise = supabaseClient
            .from('placas')
            .select('*')
            .eq('id', id.trim())
            .single();

          const { data, error } = await Promise.race([queryPromise, timeoutPromise]);

          if (!error && data && data.url_destino) {
            urlDestino = data.url_destino;
            // Incrementar contador de visitas en segundo plano
            supabaseClient.from('placas').update({ visitas: (data.visitas || 0) + 1 }).eq('id', id.trim()).then(() => {});
          }
        } catch (err) {
          console.warn("Consulta Supabase no completada, revisando almacenamiento local:", err);
        }
      }

      // 2. Fallback: Buscar en LocalStorage si Supabase no devolvió nada
      if (!urlDestino) {
        const locales = obtenerPlacasLocales();
        const encontrada = locales.find(x => x.id === id.trim());
        if (encontrada && encontrada.url_destino) {
          urlDestino = encontrada.url_destino;
        }
      }

      // 3. Ejecutar Redirección o Mostrar Pantalla de Configuración
      if (urlDestino) {
        msgEl.innerHTML = `Redirigiendo a <span class="text-sky-400 font-mono">${urlDestino}</span>...`;
        
        let finalUrl = urlDestino.trim();
        if (!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) {
          finalUrl = 'https://' + finalUrl;
        }

        setTimeout(() => {
          window.location.replace(finalUrl);
        }, 300);
      } else {
        loaderEl.style.display = 'none';
        titleEl.innerText = "Placa sin configurar";
        msgEl.innerHTML = `
          La placa con ID <b class="text-sky-400 font-mono">${id}</b> aún no tiene un destino asignado.<br><br>
          <a href="dashboard.html" class="inline-block px-5 py-2.5 bg-sky-500 hover:bg-sky-400 rounded-xl text-xs font-bold text-white transition shadow-lg shadow-sky-500/25">
            Configurar Placa en Panel
          </a>
        `;
      }
    }

    ejecutarRedireccion();
  </script>
</body>
</html>
